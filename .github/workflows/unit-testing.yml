name: "Unit Tests"

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Running unit tests"
    runs-on: ubuntu-latest
    environment: "testing"
    env:
        sdl3-branch: 'release-3.4.18'

    steps:
    - uses: awalsh128/cache-apt-pkgs-action@latest
      name: Install required packages
      with:
        packages: flex bison ninja-build cmake clang
        version: "${{ runner.os }}-${{ runner.arch }}-unittest-v2"

    # SDL 3 (Ubuntu 24.04 has none), without video drivers: the tests open
    # no window
    - name: Cache SDL3
      id: cache-sdl3
      uses: actions/cache@v4
      with:
        path: 'thirdparties/SDL3/install'
        key: ${{ runner.os }}-unittest-sdl3-${{ env.sdl3-branch }}-v1

    - name: Checkout SDL3
      if: steps.cache-sdl3.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: 'libsdl-org/SDL'
        path: 'thirdparties/SDL3'
        ref: '${{ env.sdl3-branch }}'

    - name: Configure and install SDL3
      if: steps.cache-sdl3.outputs.cache-hit != 'true'
      working-directory: ${{github.workspace}}/thirdparties/SDL3
      run: |
        cmake -B ./build \
        -DCMAKE_BUILD_TYPE=Release \
        -DSDL_TESTS=OFF \
        -DSDL_EXAMPLES=OFF \
        -DSDL_X11=OFF \
        -DSDL_WAYLAND=OFF \
        -DSDL_UNIX_CONSOLE_BUILD=ON \
        -DCMAKE_INSTALL_PREFIX='${{github.workspace}}/thirdparties/SDL3/install'
        cmake --build ./build --config Release --parallel
        cmake --install ./build --config Release

    - uses: actions/checkout@v4
      with:
        path: 'source'

    # for the replay app's tests
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install PySide6
      run: |
        pip install PySide6-Essentials

    - name: Settings
      working-directory: ${{github.workspace}}
      run: |
        echo "CMAKE_GENERATOR=Ninja Multi-Config" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV
        echo "CMAKE_PARAM=--log-level=VERBOSE \
        -DCMAKE_INSTALL_PREFIX='${{github.workspace}}/install' \
        -DSDL3_DIR='${{github.workspace}}/thirdparties/SDL3/install/lib/cmake/SDL3'" \
        -DBUILD_RENDERER_VULKAN=OFF >> $GITHUB_ENV

    - name: Configure CMake
      working-directory: ${{github.workspace}}
      run: |
        cmake -B ./build ${{ env.CMAKE_PARAM }} ./source

    - name: Build
      working-directory: ${{github.workspace}}
      run: |
        cmake --build ${{github.workspace}}/build --config Debug --parallel

    - name: Test
      working-directory: ${{github.workspace}}
      run: |
        cd "${{github.workspace}}/build"
        ctest -C Debug --output-on-failure
